name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "aws/sagemaker/**"
      - "tests/aws/sagemaker/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "aws/sagemaker/**"
      - "tests/aws/sagemaker/**"
      - ".github/workflows/ci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check aws/sagemaker/lstm_src/ aws/sagemaker/tft_src/ tests/aws/sagemaker/

  smoke-test-lstm:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # CPU-only wheel: much faster to install in CI than the default (CUDA-bundled) build
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install pandas numpy boto3 pytest
      - run: pytest tests/aws/sagemaker/test_lstm_smoke.py -v

  # NOTE: no TFT smoke test yet. pytorch-forecasting + lightning add real install time to every
  # PR; deliberately deferred rather than slowing down every CI run for the stretch model. Revisit
  # if TFT's train.py sees frequent changes.
  # NOTE: path filters above mean this workflow only triggers on aws/sagemaker/* changes. As
  # GCP/Azure get added, either broaden this file's paths or split into per-provider workflow
  # files (ci-aws.yml, ci-gcp.yml) -- the latter scales better once there's more than one provider's
  # worth of CI logic to keep straight.
